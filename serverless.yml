service: callmyecho

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 30
  environment:
    STAGE: ${self:provider.stage}
    HUME_API_KEY: ${ssm:/callmyecho/prod/hume-api}
    HUME_SECRET_KEY: ${ssm:/callmyecho/prod/hume-secret}
    TWILIO_AUTH_TOKEN: ${ssm:/callmyecho/prod/twilio-auth}
    TWILIO_ACCOUNT_SID: ${ssm:/callmyecho/prod/twilio-account}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
    - Effect: Allow
      Action:
        - ssm:GetParameter
        - ssm:GetParameters
      Resource:
        - "arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/callmyecho/prod/*"

functions:
  twilioWebhook:
    handler: src/handlers/twilioWebhook.handler
    events:
      - http:
          path: /webhook/twilio
          method: post
          cors: false
    environment:
      FUNCTION_NAME: twilioWebhook

  healthCheck:
    handler: src/handlers/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: true
    environment:
      FUNCTION_NAME: healthCheck

plugins:
  - serverless-offline

# Simplified deployment - will add CloudFront and custom domain after basic deployment works