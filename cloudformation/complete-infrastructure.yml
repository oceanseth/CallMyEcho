AWSTemplateFormatVersion: '2010-09-09'
Description: 'Complete infrastructure for CallMyEcho - Route53, CloudFront, and custom domain'

Parameters:
  DomainName:
    Type: String
    Default: callmyecho.com
    Description: The domain name for the CallMyEcho service

  ApiGatewayDomain:
    Type: String
    Default: cxbgv8ynbc.execute-api.us-east-1.amazonaws.com
    Description: The API Gateway domain name

Resources:
  # Route53 Hosted Zone
  CallMyEchoHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: "Hosted zone for CallMyEcho service"

  # SSL Certificate for CloudFront (must be in us-east-1)
  CallMyEchoCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref CallMyEchoHostedZone
        - DomainName: !Sub '*.${DomainName}'
          HostedZoneId: !Ref CallMyEchoHostedZone

  # CloudFront Distribution
  CallMyEchoCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
        Origins:
          - Id: ApiGatewayOrigin
            DomainName: !Ref ApiGatewayDomain
            OriginPath: "/prod"
            CustomOriginConfig:
              HTTPPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        Enabled: true
        Comment: "CloudFront distribution for CallMyEcho API"
        ViewerCertificate:
          AcmCertificateArn: !Ref CallMyEchoCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # Route53 Record for root domain
  CallMyEchoRoute53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref CallMyEchoHostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CallMyEchoCloudFront.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID

  # Route53 Record for www subdomain
  CallMyEchoWWWRoute53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref CallMyEchoHostedZone
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CallMyEchoCloudFront.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID

Outputs:
  HostedZoneId:
    Description: "Route53 Hosted Zone ID"
    Value: !Ref CallMyEchoHostedZone
    Export:
      Name: callmyecho-hosted-zone-id

  HostedZoneNameServers:
    Description: "Name servers for the hosted zone"
    Value: !Join [',', !GetAtt CallMyEchoHostedZone.NameServers]
    Export:
      Name: callmyecho-name-servers

  CertificateArn:
    Description: "SSL Certificate ARN"
    Value: !Ref CallMyEchoCertificate
    Export:
      Name: callmyecho-certificate-arn

  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref CallMyEchoCloudFront
    Export:
      Name: callmyecho-cloudfront-id

  CloudFrontDomainName:
    Description: "CloudFront Distribution Domain Name"
    Value: !GetAtt CallMyEchoCloudFront.DomainName
    Export:
      Name: callmyecho-cloudfront-domain

  CustomDomainURL:
    Description: "Custom domain URL"
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: callmyecho-custom-domain-url