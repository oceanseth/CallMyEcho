AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront distribution for CallMyEcho using existing Route53 hosted zone'

Parameters:
  DomainName:
    Type: String
    Default: callmyecho.com
    Description: The domain name for the CallMyEcho service

  ApiGatewayDomain:
    Type: String
    Default: cxbgv8ynbc.execute-api.us-east-1.amazonaws.com
    Description: The API Gateway domain name

  HostedZoneId:
    Type: String
    Default: Z04474112ZDLR5VYBHL61
    Description: Existing Route53 hosted zone ID

Resources:
  # SSL Certificate for CloudFront (must be in us-east-1)
  CallMyEchoCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub '*.${DomainName}'
          HostedZoneId: !Ref HostedZoneId

  # CloudFront Distribution
  CallMyEchoCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
        Origins:
          - Id: ApiGatewayOrigin
            DomainName: !Ref ApiGatewayDomain
            OriginPath: "/prod"
            CustomOriginConfig:
              HTTPPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        Enabled: true
        Comment: "CloudFront distribution for CallMyEcho API"
        ViewerCertificate:
          AcmCertificateArn: !Ref CallMyEchoCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # Route53 Record for root domain
  CallMyEchoRoute53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CallMyEchoCloudFront.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID

  # Route53 Record for www subdomain
  CallMyEchoWWWRoute53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CallMyEchoCloudFront.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID

Outputs:
  CertificateArn:
    Description: "SSL Certificate ARN"
    Value: !Ref CallMyEchoCertificate
    Export:
      Name: callmyecho-certificate-arn

  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref CallMyEchoCloudFront
    Export:
      Name: callmyecho-cloudfront-id

  CloudFrontDomainName:
    Description: "CloudFront Distribution Domain Name"
    Value: !GetAtt CallMyEchoCloudFront.DomainName
    Export:
      Name: callmyecho-cloudfront-domain

  CustomDomainURL:
    Description: "Custom domain URL"
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: callmyecho-custom-domain-url